<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Green Book">
<meta name="theme-color" content="#1f4d33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Green Book Hymn Finder</title>
<script src="pdf.min.js"></script>
<script src="pdf.worker.min.js"></script>
<style>
:root{--g:#1f4d33;--g2:#2e6b48;--bg:#f4f1ea;--card:#fff;--ink:#1b1b1b;--mut:#6b6b6b;--accent:#1f4d33;--press:#e6e1d6;--line:#ddd7ca;--viewbg:#cfcac0;--star:#e0a100;--pagefx:none}
:root[data-theme="dark"]{--bg:#121614;--card:#1d2420;--ink:#e9ece9;--mut:#9aa59e;--accent:#8fd1a8;--press:#2a332e;--line:#2c3631;--viewbg:#000;--pagefx:invert(1) hue-rotate(180deg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#1d2420;--ink:#e9ece9;--mut:#9aa59e;--accent:#8fd1a8;--press:#2a332e;--line:#2c3631;--viewbg:#000;--pagefx:invert(1) hue-rotate(180deg)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;cursor:pointer}
.screen{display:none;min-height:100%;flex-direction:column}
.screen.on{display:flex}
header{background:var(--g);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;font-weight:600;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:15px}
header button[hidden]{display:none}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:16px;max-width:420px;width:100%;margin:0 auto}
.display{width:100%;background:var(--card);border:2px solid var(--accent);border-radius:14px;font-size:56px;font-weight:700;text-align:center;padding:10px;min-height:88px;letter-spacing:2px;color:var(--accent)}
.display.empty{color:var(--mut);opacity:.6;font-weight:400;font-size:28px;line-height:64px;letter-spacing:0}
.hint{color:var(--mut);font-size:14px;min-height:18px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pad button{font-size:28px;padding:16px 0;border-radius:12px;border:0;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.15);color:var(--ink)}
.pad button:active{background:var(--press)}
.pad .go{background:var(--g);color:#fff;font-weight:700}
.pad .go:active{background:var(--g2)}
.setup p{line-height:1.5;margin:0}
.big{display:block;width:100%;text-align:center;background:var(--g);color:#fff;border-radius:12px;padding:16px;font-size:18px;font-weight:600}
input[type=file]{display:none}
.small{font-size:13px;color:var(--mut);text-align:center}
.small a{color:var(--accent)}

/* favourites / recent */
.lists{width:100%;display:flex;flex-direction:column;gap:14px}
.list h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 8px;font-weight:600;display:flex;align-items:center}
.list h2 button{margin-left:auto;background:none;border:0;color:var(--mut);font-size:13px;padding:2px 4px;text-transform:none;letter-spacing:0;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-width:56px;padding:10px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;font-weight:600}
.chips button:active{background:var(--press)}
.chips .fav::before{content:"★ ";color:var(--star)}
.empty-note{font-size:14px;color:var(--mut)}
.search{width:100%;position:relative}
.search input{width:100%;font-size:18px;padding:13px 44px 13px 42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:18px;pointer-events:none}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);font-size:22px;padding:6px 10px;display:none}
.search.has .x{display:block}
#numArea{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.searching #numArea{display:none}
#results{width:100%;display:none;flex-direction:column;gap:8px}
.searching #results{display:flex}
.res{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.res:active{background:var(--press)}
.res .n{flex:none;min-width:44px;font-weight:700;font-size:20px;color:var(--accent)}
.res .b{flex:1;min-width:0}
.res .f{font-weight:600;line-height:1.3}
.res .s{color:var(--mut);font-size:14px;margin-top:3px;line-height:1.35}
.res mark{background:rgba(224,161,0,.3);color:inherit;border-radius:3px;padding:0 1px}
.rows{display:flex;flex-direction:column;gap:6px}
.rows .res{padding:10px 12px}
.rows .res .n{font-size:18px}
.rows .fav .n::before{content:"★ ";color:var(--star);font-size:14px}

/* viewer */
.viewer{background:var(--viewbg)}
.pages{position:fixed;inset:0;overflow:auto;display:flex;background:var(--viewbg);touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet{margin:auto;flex:none;display:flex;gap:8px;padding:6px}
.sheet.stack{flex-direction:column;align-items:center}
.sheet.side{flex-direction:row;align-items:flex-start}
.sheet canvas{display:block;flex:none;background:#fff;filter:var(--pagefx);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sheet.fade{opacity:.35;transition:opacity .15s}
.msg{margin:auto;padding:30px 16px;text-align:center;color:var(--mut)}
.ctl{position:fixed;left:0;right:0;display:flex;align-items:center;gap:6px;padding:10px 10px;pointer-events:none;transition:opacity .25s;z-index:5}
.ctl.top{top:0;padding-top:max(10px,env(safe-area-inset-top))}
.ctl.bot{bottom:0;padding-bottom:max(10px,env(safe-area-inset-bottom));justify-content:center}
.ctl button{pointer-events:auto;border:0;border-radius:22px;padding:10px 14px;font-size:17px;background:rgba(31,77,51,.9);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);min-width:44px}
.ctl .t{pointer-events:none;margin-left:auto;background:rgba(31,77,51,.9);color:#fff;border-radius:22px;padding:10px 16px;font-size:16px;font-weight:600}
.ctl button:disabled{opacity:.35}
.ctl .on-star{color:#ffd24a}
.ctl .grp{display:flex;gap:6px;flex:1;justify-content:center}
.hide .ctl{opacity:0}.hide .ctl button{pointer-events:none}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 14px;border-radius:18px;font-size:15px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s;z-index:6}
.toast.on{opacity:1}
</style>
</head>
<body>
<section id="setup" class="screen setup">
  <header><h1>Green Book Hymn Finder</h1></header>
  <div class="wrap">
    <p><b>One-time setup.</b> Choose your PDF copy of the Christadelphian Hymn Book (the Green Book). It stays on this phone, so you only do this once.</p>
    <label class="big" for="file">Choose the Green Book PDF</label>
    <input type="file" id="file" accept="application/pdf,.pdf">
    <div class="hint" id="setupMsg"></div>
    <p class="small">Need help installing it or sharing it with someone? <a href="install.html">How to install &amp; share</a></p>
  </div>
</section>

<section id="find" class="screen">
  <header><h1>Green Book</h1><button id="themeBtn" type="button" aria-label="Light or dark">◐ Auto</button><button id="installBtn" type="button" hidden>Install</button><button id="shareBtn" type="button" aria-label="Install and share">Share</button><button id="changeBtn" type="button">PDF</button></header>
  <div class="wrap" id="findWrap">
    <div class="search" id="searchBox"><span class="ico">⌕</span><input id="q" type="text" placeholder="Search words, e.g. shepherd" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button class="x" id="qClear" type="button" aria-label="Clear search">×</button></div>
    <div id="results"></div>
    <div id="numArea">
    <div class="display empty" id="disp">Hymn number</div>
    <div class="hint" id="hint"></div>
    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-k="del">⌫</button><button>0</button><button data-k="go" class="go">Go</button>
    </div>
    <div class="lists">
      <div class="list"><h2>Favourites</h2><div class="rows" id="favList"></div></div>
      <div class="list"><h2>Recent<button id="clearRecent" type="button">Clear</button></h2><div class="rows" id="recentList"></div></div>
    </div>
    </div>
  </div>
</section>

<section id="view" class="screen viewer">
  <div class="pages" id="pages"><div class="sheet stack" id="sheet"></div></div>
  <div class="ctl top"><button id="backBtn" type="button">‹ Back</button><button id="starBtn" type="button" aria-label="Favourite">☆</button><span class="t" id="vTitle">Hymn</span></div>
  <div class="ctl bot">
    <button id="prevH" type="button" aria-label="Previous hymn">‹</button>
    <div class="grp">
      <button id="zOut" type="button" aria-label="Zoom out">−</button>
      <button id="zFit" type="button" aria-label="Fit whole hymn">Fit</button>
      <button id="zIn" type="button" aria-label="Zoom in">+</button>
      <button id="layBtn" type="button" aria-label="Page layout">⇅</button>
    </div>
    <button id="nextH" type="button" aria-label="Next hymn">›</button>
  </div>
  <div class="toast" id="toast"></div>
</section>

<script>
const MAP=[4, 5, 7, 10, 11, 12, 13, 15, 16, 17, 20, 21, 22, 23, 24, 26, 28, 29, 31, 32, 33, 34, 35, 36, 38, 39, 40, 41, 44, 45, 47, 48, 49, 50, 52, 53, 55, 58, 59, 60, 61, 62, 63, 65, 67, 68, 69, 70, 72, 73, 74, 75, 76, 77, 78, 79, 80, 82, 83, 84, 85, 86, 90, 92, 93, 94, 95, 96, 98, 99, 100, 101, 103, 104, 106, 107, 109, 111, 113, 114, 115, 117, 119, 121, 123, 125, 126, 127, 129, 131, 132, 133, 134, 137, 138, 141, 142, 143, 145, 147, 149, 151, 152, 153, 155, 157, 159, 160, 161, 163, 165, 166, 167, 169, 170, 171, 174, 175, 176, 177, 179, 181, 183, 184, 185, 187, 188, 191, 193, 195, 196, 197, 199, 200, 203, 205, 206, 207, 208, 209, 213, 214, 215, 217, 219, 220, 221, 223, 224, 225, 227, 229, 230, 231, 232, 233, 234, 235, 236, 237, 238, 240, 241, 243, 244, 245, 246, 247, 248, 249, 253, 254, 255, 257, 258, 259, 261, 262, 263, 264, 265, 267, 268, 271, 272, 273, 274, 275, 277, 279, 280, 281, 282, 283, 285, 287, 289, 291, 292, 293, 294, 295, 297, 298, 299, 301, 302, 303, 304, 307, 309, 310, 311, 313, 314, 315, 316, 317, 318, 319, 320, 321, 323, 324, 325, 326, 327, 329, 331, 332, 333, 334, 335, 336, 337, 338, 339, 341, 342, 343, 345, 346, 347, 348, 349, 351, 353, 355, 357, 358, 359, 360, 361, 363, 364, 365, 367, 369, 370, 371, 373, 374, 375, 376, 377, 379, 380, 381, 383, 385, 387, 388, 389, 391, 393, 395, 396, 397, 399, 401, 402, 403, 404, 408, 409, 411, 413, 414, 415, 417, 421, 423, 424, 425, 427, 429, 431, 432, 433, 436, 437, 439, 440, 441, 442, 443, 444, 447, 451, 455, 456, 457, 458, 459, 461, 462, 463, 465, 466, 467, 469, 470, 471, 472, 473, 476, 479, 483, 486, 487, 489, 490, 491, 492, 493, 495, 496, 497, 499, 502, 503, 504, 505, 506, 507, 509, 510, 511, 512, 513, 515, 516, 517, 518, 519, 521, 523, 524, 525, 526, 529, 531, 532, 533, 535, 536, 537, 540, 541, 543, 544, 545, 547, 550, 551, 552, 553, 555, 556, 557, 559, 560, 561, 563, 565, 567, 569, 570, 571, 573, 574, 575, 576, 577, 580, 581, 582, 583, 584, 585, 587, 588, 589, 591, 592, 593, 594, 595, 596, 597, 598, 599, 600, 601, 603, 604, 605, 606, 607, 608, 609, 611, 612, 613, 614, 615, 617, 618, 619, 621, 623, 624, 625, 626, 627, 629, 631, 632];const END=633;
const TOTAL=MAP.length;
const START={35:51,326:475}; // hymns that begin partway down the previous page
let pdf=null, entry="", current=0, token=0;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}

// ---- small settings store (localStorage, optional) ----
function lsGet(k,d){try{const v=localStorage.getItem('gb.'+k);return v==null?d:JSON.parse(v);}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem('gb.'+k,JSON.stringify(v));}catch(e){}}
let favs=lsGet('favs',[]), recent=lsGet('recent',[]);
let theme=lsGet('theme','auto');          // auto | light | dark
let layoutPref=lsGet('layout','auto');    // auto | stack | side
let zoomPref=lsGet('zoom',{mode:'fit'});  // {mode:'fit'} or {mode:'w', r:<times fit-width>}

// ---- theme ----
function applyTheme(){
  const r=document.documentElement;
  if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);
  $('themeBtn').textContent={auto:'◐ Auto',light:'☀ Light',dark:'☾ Dark'}[theme];
}
$('themeBtn').onclick=()=>{theme={auto:'light',light:'dark',dark:'auto'}[theme];lsSet('theme',theme);applyTheme();};
applyTheme();

// ---- storage (IndexedDB, optional) ----
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('greenbook',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}});}
async function saveBlob(b){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(b,'pdf');t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
async function loadBlob(){try{const db=await idb();return await new Promise((res)=>{const t=db.transaction('f');const q=t.objectStore('f').get('pdf');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null}}

async function openPdf(blob){
  const buf=await blob.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  if(doc.numPages<END){throw new Error('This PDF only has '+doc.numPages+' pages — it doesn\'t look like the Green Book scan.');}
  return doc;
}

$('file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  $('setupMsg').textContent='Loading…';
  try{ pdf=await openPdf(f); await saveBlob(f); $('setupMsg').textContent=''; goFind(); }
  catch(err){ $('setupMsg').textContent=err.message||'Could not open that file.'; }
  e.target.value='';
});
$('changeBtn').onclick=()=>show('setup');

// ---- keypad ----
function reset(){entry="";paint();}
function paint(){
  const d=$('disp');
  if(entry){d.textContent=entry;d.classList.remove('empty');}
  else{d.textContent='Hymn number';d.classList.add('empty');}
  const n=parseInt(entry,10);
  $('hint').textContent=(n&&n<=TOTAL&&HY)?(HY[n-1].f||''):'';
}
function press(k){
  if(k==='del'){entry=entry.slice(0,-1);paint();return;}
  if(k==='go'){go();return;}
  if(entry.length>=3) return;
  if(entry===''&&k==='0') return;
  entry+=k; paint();
}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;press(b.dataset.k||b.textContent.trim());});
document.addEventListener('keydown',e=>{
  if($('find').classList.contains('on')&&document.activeElement!==$('q')){
    if(/^[0-9]$/.test(e.key))press(e.key);
    else if(e.key==='Backspace')press('del');
    else if(e.key==='Enter')press('go');
  }else if($('view').classList.contains('on')){
    if(e.key==='ArrowLeft')$('prevH').click();
    else if(e.key==='ArrowRight')$('nextH').click();
    else if(e.key==='+'||e.key==='=')zoomBy(1.25);
    else if(e.key==='-')zoomBy(0.8);
    else if(e.key==='0')fitAll(true);
    else if(e.key==='Escape')$('backBtn').click();
  }
});
function go(){
  const n=parseInt(entry,10);
  if(!n||n<1||n>TOTAL){$('hint').textContent='Hymns run from 1 to '+TOTAL+'.';return;}
  openHymn(n);
}

// ---- favourites & recent ----
function chip(n,cls){const b=document.createElement('button');b.type='button';b.className='res'+(cls?' '+cls:'');
  b.innerHTML='<span class="n">'+n+'</span><span class="b"><span class="f"></span></span>';
  b.querySelector('.f').textContent=HY?(HY[n-1].f||''):'';b.onclick=()=>openHymn(n);return b;}
function renderLists(){
  const fl=$('favList'),rl=$('recentList');fl.innerHTML='';rl.innerHTML='';
  if(!favs.length)fl.innerHTML='<span class="empty-note">Tap ☆ while viewing a hymn to add it here.</span>';
  [...favs].sort((a,b)=>a-b).forEach(n=>fl.appendChild(chip(n,'fav')));
  if(!recent.length)rl.innerHTML='<span class="empty-note">Hymns you open will show here.</span>';
  recent.slice(0,8).forEach(n=>rl.appendChild(chip(n)));
  $('clearRecent').style.display=recent.length?'':'none';
}
function addRecent(n){recent=[n,...recent.filter(x=>x!==n)].slice(0,12);lsSet('recent',recent);}
function paintStar(){const on=favs.includes(current);$('starBtn').textContent=on?'★':'☆';$('starBtn').classList.toggle('on-star',on);}
$('starBtn').onclick=()=>{
  if(favs.includes(current)){favs=favs.filter(x=>x!==current);toast('Removed from favourites');}
  else{favs.push(current);toast('Added to favourites');}
  lsSet('favs',favs);paintStar();flash();
};
$('clearRecent').onclick=()=>{recent=[];lsSet('recent',recent);renderLists();};
function goFind(){token++;reset();renderLists();show('find');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}

let toastT=null;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),900);}

// ---- viewer: render ----
const box=$('pages'), sheet=$('sheet');
let pagesC=[];        // rendered (cropped) canvases for the current hymn
let layout='stack';   // layout in use: stack | side
let scale=1;          // CSS px per rendered canvas px
let touched=false;    // user changed zoom on this hymn (stop auto-fitting while pages load)

async function openHymn(n){
  current=n; const my=++token;
  addRecent(n);
  $('vTitle').textContent='Hymn '+n; paintStar();
  $('prevH').disabled=n<=1; $('nextH').disabled=n>=TOTAL;
  pagesC=[]; touched=false;
  if(sheet.children.length)sheet.classList.add('fade');
  show('view'); flash();
  if(!sheet.children.length)sheet.innerHTML='<div class="msg">Loading…</div>';
  if(location.hash!=='#h'+n){try{history.replaceState(null,'','#h'+n)}catch(e){}}
  const from=START[n]||MAP[n-1], to=(n<TOTAL?MAP[n]:END)-1;
  const w=Math.max(window.innerWidth,window.innerHeight), dpr=Math.min(window.devicePixelRatio||1,3), q=Math.max(dpr*2,3);
  for(let p=from;p<=to;p++){
    const page=await pdf.getPage(p); if(my!==token) return;
    const v1=page.getViewport({scale:1}); const s=Math.min((w*q)/v1.width, 3200/v1.width);
    const vp=page.getViewport({scale:s});
    const c=document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; if(my!==token) return;
    pagesC.push(crop(c));
    if(p===from){sheet.innerHTML='';sheet.classList.remove('fade');box.scrollTo(0,0);}
    sheet.appendChild(pagesC[pagesC.length-1]);
    if(!touched)applyPref(); else applyScale(scale);
  }
  flash();
}
// trim the white margins of a scanned page
function crop(c){
  const W=c.width,H=c.height,ctx=c.getContext('2d');
  const step=Math.max(1,Math.floor(W/600));
  const sw=Math.floor(W/step),sh=Math.floor(H/step);
  const sm=document.createElement('canvas');sm.width=sw;sm.height=sh;
  const sx=sm.getContext('2d');sx.drawImage(c,0,0,sw,sh);
  const d=sx.getImageData(0,0,sw,sh).data;
  const rows=new Uint16Array(sh),cols=new Uint16Array(sw);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=(y*sw+x)*4;if(d[i]+d[i+1]+d[i+2]<480){rows[y]++;cols[x]++;}}
  const minR=Math.max(2,sw*0.004),minC=Math.max(2,sh*0.004);
  const edge=Math.round(Math.min(sw,sh)*0.012);
  let t=edge;while(t<sh&&rows[t]<minR)t++;
  let b=sh-1-edge;while(b>t&&rows[b]<minR)b--;
  let l=edge;while(l<sw&&cols[l]<minC)l++;
  let r=sw-1-edge;while(r>l&&cols[r]<minC)r--;
  if(r-l<sw*0.3||b-t<sh*0.2)return c;
  const pad=Math.round(sw*0.015);
  l=Math.max(0,l-pad);r=Math.min(sw-1,r+pad);t=Math.max(0,t-pad);b=Math.min(sh-1,b+pad);
  const X=l*step,Y=t*step,CW=Math.min(W-X,(r-l+1)*step),CH=Math.min(H-Y,(b-t+1)*step);
  const o=document.createElement('canvas');o.width=CW;o.height=CH;
  o.getContext('2d').drawImage(c,X,Y,CW,CH,0,0,CW,CH);
  return o;
}

// ---- viewer: layout & zoom ----
const GAP=8, PAD=6;
function contentSize(lay){
  let w=0,h=0;
  pagesC.forEach((c,i)=>{
    if(lay==='side'){w+=c.width;h=Math.max(h,c.height);}
    else{w=Math.max(w,c.width);h+=c.height;}
  });
  return {w,h,gaps:Math.max(0,pagesC.length-1)*GAP+PAD*2,lay};
}
function fitScales(lay){
  const s=contentSize(lay), vw=box.clientWidth, vh=box.clientHeight;
  const gx=lay==='side'?s.gaps:PAD*2, gy=lay==='side'?PAD*2:s.gaps;
  const width=(vw-gx)/s.w, all=Math.min(width,(vh-gy)/s.h);
  return {width,all};
}
// pick the layout that shows the whole hymn (music + words) biggest
function bestLayout(){
  if(layoutPref!=='auto'||pagesC.length<2)return layoutPref==='auto'?'stack':layoutPref;
  return fitScales('side').all>fitScales('stack').all*1.05?'side':'stack';
}
function setLayout(l){layout=l;sheet.className='sheet '+l;$('layBtn').textContent=l==='side'?'⇆':'⇅';}
function applyScale(s){
  if(!pagesC.length)return;
  const f=fitScales(layout);
  scale=Math.min(Math.max(s,f.all*0.5),f.width*5);
  pagesC.forEach(c=>{c.style.width=(c.width*scale)+'px';c.style.height=(c.height*scale)+'px';});
}
function applyPref(){
  if(!pagesC.length)return;
  setLayout(bestLayout());
  const f=fitScales(layout);
  applyScale(zoomPref.mode==='w'?f.width*zoomPref.r:f.all);
}
function remember(){
  const f=fitScales(layout);
  zoomPref=Math.abs(scale-f.all)/f.all<0.02?{mode:'fit'}:{mode:'w',r:scale/f.width};
  lsSet('zoom',zoomPref);
}
// zoom keeping the point (cx,cy) on screen still
function zoomAt(s,cx,cy){
  const r=sheet.getBoundingClientRect(), old=scale;
  const px=(cx-r.left)/old, py=(cy-r.top)/old;
  applyScale(s);
  const r2=sheet.getBoundingClientRect();
  box.scrollLeft+=r2.left-(cx-px*scale);
  box.scrollTop+=r2.top-(cy-py*scale);
}
function zoomBy(k){touched=true;zoomAt(scale*k,box.clientWidth/2,box.clientHeight/2);remember();toast(Math.round(scale/fitScales(layout).width*100)+'%');flash();}
function fitAll(say){touched=true;applyScale(fitScales(layout).all);box.scrollTo(0,0);remember();if(say)toast('Whole hymn');flash();}
$('zIn').onclick=()=>zoomBy(1.25);
$('zOut').onclick=()=>zoomBy(0.8);
$('zFit').onclick=()=>{
  // tap Fit: whole hymn; tap again: fit to width
  const f=fitScales(layout);
  if(Math.abs(scale-f.all)/f.all<0.02&&Math.abs(f.width-f.all)/f.all>0.02){touched=true;applyScale(f.width);box.scrollTo(0,0);remember();toast('Fit width');flash();}
  else fitAll(true);
};
$('layBtn').onclick=()=>{
  setLayout(layout==='side'?'stack':'side');
  layoutPref=layout;lsSet('layout',layoutPref);
  touched=true;applyScale(fitScales(layout).all);box.scrollTo(0,0);remember();
  toast(layout==='side'?'Pages side by side':'Pages stacked');flash();
};
$('layBtn').addEventListener('contextmenu',e=>{e.preventDefault();layoutPref='auto';lsSet('layout','auto');applyPref();toast('Layout: automatic');});
window.addEventListener('resize',()=>{if($('view').classList.contains('on')&&pagesC.length){if(zoomPref.mode==='fit'||!touched)applyPref();else applyScale(scale);}});

// ---- viewer: touch (pinch to zoom, swipe for next/prev, tap for controls) ----
let pinch=null, swipe=null, rafP=0;
function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
box.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    swipe=null;
    pinch={d:dist(e.touches),s:scale};
  }else if(e.touches.length===1&&!pinch){
    const t=e.touches[0];
    swipe={x:t.clientX,y:t.clientY,t:Date.now(),sl:box.scrollLeft,max:box.scrollWidth-box.clientWidth};
  }
},{passive:true});
box.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length===2){
    e.preventDefault();
    const t=e.touches, cx=(t[0].clientX+t[1].clientX)/2, cy=(t[0].clientY+t[1].clientY)/2, k=dist(t)/pinch.d;
    cancelAnimationFrame(rafP);
    rafP=requestAnimationFrame(()=>{touched=true;zoomAt(pinch.s*k,cx,cy);});
  }
},{passive:false});
box.addEventListener('touchend',e=>{
  if(pinch){if(e.touches.length===0){pinch=null;remember();flash();}return;}
  if(!swipe)return;
  const t=e.changedTouches[0], dx=t.clientX-swipe.x, dy=t.clientY-swipe.y, dt=Date.now()-swipe.t, s=swipe; swipe=null;
  if(dt>700||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.8)return;
  // only change hymn when the page isn't being panned sideways
  if(dx<0&&s.sl>=s.max-2&&current<TOTAL)openHymn(current+1);
  else if(dx>0&&s.sl<=2&&current>1)openHymn(current-1);
});
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
// trackpad / ctrl+wheel zoom on desktop
box.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();touched=true;zoomAt(scale*Math.exp(-e.deltaY/200),e.clientX,e.clientY);clearTimeout(rafP);rafP=setTimeout(remember,300);},{passive:false});

// controls fade away so the hymn fills the screen; tap to bring them back
let hideT=null;
function flash(){const v=$('view');v.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>v.classList.add('hide'),2500);}
box.addEventListener('click',()=>{const v=$('view');if(v.classList.contains('hide'))flash();else{clearTimeout(hideT);v.classList.add('hide');}});
$('backBtn').onclick=goFind;
$('prevH').onclick=()=>{if(current>1)openHymn(current-1)};
$('nextH').onclick=()=>{if(current<TOTAL)openHymn(current+1)};

// ---- word search ----
let HY=null;
const norm=t=>t.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
fetch('hymns.json').then(r=>r.json()).then(d=>{HY=d;HY.forEach(h=>{h.fn=norm(h.f);h.w=h.x.split(' ');h.sw=norm(h.s||'').split(' ');});renderLists();paint();if($('q').value)runSearch();}).catch(()=>{});
function esc(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function runSearch(){
  const raw=$('q').value, q=norm(raw), box=$('results');
  $('searchBox').classList.toggle('has',!!raw);
  $('findWrap').classList.toggle('searching',!!q);
  if(!q){box.innerHTML='';return;}
  if(/^\d+$/.test(q)){const n=+q;box.innerHTML='';if(n>=1&&n<=TOTAL)box.appendChild(resRow(n,HY?HY[n-1].f:'',''));else box.innerHTML='<div class="empty-note">Hymns run from 1 to '+TOTAL+'.</div>';return;}
  if(!HY){box.innerHTML='<div class="empty-note">Loading words…</div>';return;}
  const qs=q.split(' ').filter(Boolean), hits=[];
  for(const h of HY){
    // every word typed must start a word in the hymn (last word can be partly typed)
    let pos=-1,ok=true;
    for(let i=0;i<qs.length&&ok;i++){
      const k=h.w.findIndex(w=>w.startsWith(qs[i]));
      if(k<0){if(!h.sw.some(w=>w.length>3&&w.startsWith(qs[i])))ok=false;}else if(pos<0)pos=k;
    }
    if(!ok)continue;
    let score=0;
    if(h.fn.startsWith(q))score+=100;else if((' '+h.fn+' ').includes(' '+q))score+=60;
    const xi=(' '+h.x+' ').indexOf(' '+q+' '), xp=xi<0?(' '+h.x).indexOf(' '+q):xi;
    if(xi>=0)score+=40;else if(xp>=0)score+=30;
    if(qs.every(t=>h.fn.split(' ').some(w=>w.startsWith(t))))score+=20;
    if(xp>=0)pos=h.x.slice(0,xp).split(' ').filter(Boolean).length;
    hits.push({h,score,pos});
  }
  hits.sort((a,b)=>b.score-a.score||a.h.n-b.h.n);
  box.innerHTML='';
  if(!hits.length){box.innerHTML='<div class="empty-note">No hymn has those words. Try fewer or different words.</div>';return;}
  hits.slice(0,60).forEach(({h,pos})=>{
    const fl=h.fn.split(' ').length, a=pos<fl?fl:Math.max(fl,pos-4), snip=h.w.slice(a,a+14).join(' ');
    box.appendChild(resRow(h.n,h.f,h.c?'':(a>0?'… ':'')+snip+' …',qs,h.s));
  });
  if(hits.length>60){const m=document.createElement('div');m.className='empty-note';m.textContent=(hits.length-60)+' more — add another word to narrow it down.';box.appendChild(m);}
}
function resRow(n,f,snip,qs,sec){
  const b=document.createElement('button');b.type='button';b.className='res';
  let s=esc(snip||'');
  if(qs&&qs.length)s=s.replace(new RegExp('\\b('+qs.map(t=>t.replace(/[^a-z0-9]/g,'')).filter(Boolean).join('|')+')[a-z]*','gi'),'<mark>$&</mark>');
  b.innerHTML='<span class="n">'+n+'</span><span class="b"><span class="f">'+esc(f||'')+'</span>'+(snip?'<span class="s" style="display:block">'+s+'</span>':'')+(sec?'<span class="s" style="display:block;font-size:12px;opacity:.8">'+esc(sec)+'</span>':'')+'</span>';
  b.onclick=()=>{$('q').blur();openHymn(n);};
  return b;
}
$('q').addEventListener('input',runSearch);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('results').querySelector('.res');if(f)f.click();}});
$('qClear').onclick=()=>{$('q').value='';runSearch();$('q').focus();};

// ---- start ----
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
// install button (Android/Chrome offer this; iPhone uses Share → Add to Home Screen)
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('installBtn').hidden=false;});
$('installBtn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;$('installBtn').hidden=true;};
window.addEventListener('appinstalled',()=>{$('installBtn').hidden=true;});
$('shareBtn').onclick=()=>{location.href='install.html';};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
(async()=>{
  const b=await loadBlob();
  if(b){try{pdf=await openPdf(b);}catch(e){pdf=null}}
  if(!pdf){show('setup');return;}
  const m=/^#h(\d+)$/.exec(location.hash);
  if(m&&+m[1]>=1&&+m[1]<=TOTAL)openHymn(+m[1]); else goFind();
})();
</script>
